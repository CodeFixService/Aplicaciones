<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="robots" content="noindex, nofollow">
<title>Productos</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/core.css">
<script src="../../shared/core.js"></script>
<style>
  body { padding-bottom: 24px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; }
  .cats button { flex: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .item b { overflow-wrap: anywhere; }
  .item .p { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .item .p.tachado { font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: line-through; }
  .item .prem { font-size: 13px; font-weight: 700; color: var(--premium); }
  .item .cat { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><a href="../../" aria-label="Volver al inicio">‹</a><h1 id="titulo">Productos</h1><span id="tag" class="pill hidden"></span></header>
<main>
  <input id="buscar" placeholder="Buscar producto…" aria-label="Buscar producto" style="margin-bottom:12px">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
  <div class="card upsell hidden" id="cPrem" style="margin-top:16px">
    <h2>⭐ Precios Premium</h2>
    <p class="muted">Algunos productos tienen un precio especial para clientes Premium. Actívalo desde el inicio.</p>
    <div class="btns"><a class="btn warn" href="../../">Ver Premium</a></div>
  </div>
</main>
<script src="../../shared/config.js"></script>
<script src="../../shared/vendor/supabase.js"></script>
<script src="../../shared/cuenta.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  Core.registerSW('../../');
  Core.marca();
  const yo = await Cuenta.require('../../');
  // Clientes: catálogo de su tienda. Empresas: vista previa del propio.
  const negocio = yo.role === 'client' ? yo.negocio_id : yo.id;
  $('titulo').textContent = yo.role === 'client' ? (yo.negocio || 'Productos') : 'Mi catálogo (vista del cliente)';
  if (yo.is_pro) { $('tag').textContent = yo.role === 'client' ? 'PREMIUM' : 'PRO'; $('tag').classList.add('pro'); $('tag').classList.remove('hidden'); }
  const cacheKey = 'cfx:catalogo:' + negocio;
  let items = [];
  try { items = await Cuenta.rpc('catalog_of', { p_negocio: negocio }); localStorage.setItem(cacheKey, JSON.stringify(items)); }
  catch (e) { try { items = JSON.parse(localStorage.getItem(cacheKey)) || []; } catch (e2) { items = []; } }

  let cat = '';
  const precio = (n) => '$' + Number(n).toLocaleString('es-CL');
  function pintar() {
    const cats = [...new Set(items.map((i) => i.categoria).filter(Boolean))];
    $('cats').innerHTML = cats.length ? ['<button class="small ' + (cat ? 'alt' : 'on') + '" data-c="">Todo</button>']
      .concat(cats.map((c) => '<button class="small ' + (cat === c ? 'on' : 'alt') + '" data-c="' + Core.esc(c) + '">' + Core.esc(c) + '</button>')).join('') : '';
    const q = $('buscar').value.toLowerCase();
    const l = items.filter((i) => (!cat || i.categoria === cat) && (!q || i.nombre.toLowerCase().includes(q)));
    $('grid').innerHTML = l.length ? l.map((i) => {
      const prem = i.precio_premium != null;
      return '<div class="item"><span class="cat">' + Core.esc(i.categoria || '') + '</span><b>' + Core.esc(i.nombre) + '</b>' +
        (prem ? '<span class="p tachado">' + precio(i.precio) + '</span><span class="p">' + precio(i.precio_premium) + '</span><span class="prem">⭐ Precio Premium</span>'
              : '<span class="p">' + precio(i.precio) + '</span>' + (i.tiene_premium ? '<span class="prem">⭐ Tiene precio Premium</span>' : '')) + '</div>';
    }).join('') : '<p class="empty" style="grid-column:1/-1">' + (items.length ? 'Sin resultados' : 'La tienda aún no publica productos.') + '</p>';
    $('cPrem').classList.toggle('hidden', yo.is_pro || !items.some((i) => i.tiene_premium));
  }
  $('cats').onclick = (e) => { if (e.target.dataset.c !== undefined) { cat = e.target.dataset.c; pintar(); } };
  $('buscar').oninput = pintar;
  pintar();
})();
</script>
</body>
</html>
