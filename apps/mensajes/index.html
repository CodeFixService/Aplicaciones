<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="robots" content="noindex, nofollow">
<title>Mensajes</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="stylesheet" href="../../shared/core.css">
<script src="../../shared/core.js"></script>
<style>
  body { padding-bottom: 0; }
  main { max-width: 1040px; padding: 0; }
  .wrap { display: grid; grid-template-columns: 1fr; height: calc(100dvh - 61px - env(safe-area-inset-top)); }
  @media (min-width: 860px) { .wrap { grid-template-columns: 340px 1fr; border-inline: 1px solid var(--line); } }
  .lista { overflow-y: auto; background: var(--card); border-right: 1px solid var(--line); min-width: 0; }
  .lista .top2 { display: flex; gap: 8px; padding: 12px; position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); z-index: 1; }
  .conv { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .conv:hover, .conv.on { background: var(--brand-soft); }
  .av { width: 44px; height: 44px; border-radius: 14px; flex: none; display: grid; place-items: center; font-weight: 800;
    background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 55%, #000)); color: var(--brand-ink); }
  .conv .grow { flex: 1; min-width: 0; }
  .conv .last { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .n { background: var(--brand); color: var(--brand-ink); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 2px 8px; }
  .hilo { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .hilo .cab { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--line); }
  .hilo .cab .grow { flex: 1; min-width: 0; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .b { max-width: 78%; padding: 9px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--line);
    align-self: flex-start; white-space: pre-wrap; overflow-wrap: anywhere; }
  .b.mio { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-color: transparent; }
  .b small { display: block; font-size: 11px; opacity: .75; margin-top: 4px; text-align: right; }
  .b .rep { background: none; border: 0; box-shadow: none; padding: 0 0 0 6px; font-size: 11px; color: inherit; opacity: .6; }
  .dia { align-self: center; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .comp { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .comp .row { align-items: flex-end; }
  .comp textarea { min-height: 46px; max-height: 140px; resize: none; }
  .comp button { flex: none; }
  .tip { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  .tip b { color: var(--text); }
  .vacio { margin: auto; text-align: center; color: var(--muted); padding: 24px; }
  .pick li { cursor: pointer; }
  @media (max-width: 859px) {
    .wrap.abierto .lista { display: none; }
    .wrap:not(.abierto) .hilo { display: none; }
  }
  @media (min-width: 860px) { #bVolverLista { display: none; } }
</style>
</head>
<body>
<header class="top"><a href="../../" aria-label="Volver al inicio">‹</a><h1>Mensajes</h1></header>
<main>
  <div class="wrap" id="wrap">
    <aside class="lista">
      <div class="top2">
        <input id="buscar" placeholder="Buscar conversación…" aria-label="Buscar conversación">
        <button class="small" id="bNuevo">＋ Nuevo</button>
      </div>
      <div id="convs"></div>
      <div id="picker" class="hidden" style="padding:12px">
        <p class="muted">¿A quién quieres escribir?</p>
        <ul class="list pick" id="contactos"></ul>
      </div>
    </aside>
    <section class="hilo" id="hilo">
      <div class="cab hidden" id="cab">
        <button class="small alt" id="bVolverLista" aria-label="Volver a la lista">‹</button>
        <div class="av" id="cabAv">C</div>
        <div class="grow"><b id="cabNombre"></b><div class="muted" id="cabSub"></div></div>
        <button class="small alt" id="bBloquear">Bloquear</button>
      </div>
      <div class="msgs" id="msgs"><div class="vacio">Elige una conversación o toca <b>＋ Nuevo</b>.</div></div>
      <div class="comp hidden" id="comp">
        <p class="tip" id="tip"></p>
        <div class="row">
          <textarea id="texto" maxlength="1000" placeholder="Escribe tu mensaje…" aria-label="Mensaje"></textarea>
          <button id="bEnviar">Enviar</button>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="../../shared/config.js"></script>
<script src="../../shared/vendor/supabase.js"></script>
<script src="../../shared/cuenta.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  Core.registerSW('../../');
  const yo = await Cuenta.require('../../');
  const admin = yo.is_admin;
  let convs = [], actual = null, bloqueado = false, timer = null;

  const hora = (t) => new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
  const diaTxt = (t) => new Date(t).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
  const ROL = { admin: 'Soporte CodeFix', user: 'Empresa', client: 'Cliente' };

  async function cargarLista() {
    try { convs = await Cuenta.rpc('chat_list'); } catch (e) { return; }
    pintarLista();
  }
  $('buscar').oninput = pintarLista;
  function pintarLista() {
    const q = $('buscar').value.toLowerCase();
    const l = convs.filter((c) => !q || (c.nombre || '').toLowerCase().includes(q));
    $('convs').innerHTML = l.length ? l.map((c) =>
      '<div class="conv' + (actual && actual.id === c.other ? ' on' : '') + '" data-id="' + c.other + '">' +
      '<div class="av">' + Core.esc((c.nombre || '?').charAt(0).toUpperCase()) + '</div>' +
      '<div class="grow"><b>' + Core.esc(c.nombre) + '</b><div class="last">' + (c.mio ? 'Tú: ' : '') + Core.esc(c.ultimo) + '</div></div>' +
      (c.no_leidos ? '<span class="n">' + c.no_leidos + '</span>' : '<small class="muted">' + hora(c.ultimo_at) + '</small>') + '</div>'
    ).join('') : '<p class="empty">' + (q ? 'Sin resultados' : 'Aún no tienes conversaciones') + '</p>';
  }
  $('convs').onclick = (e) => {
    const el = e.target.closest('.conv');
    if (!el) return;
    const c = convs.find((x) => x.other === el.dataset.id);
    abrir({ id: c.other, nombre: c.nombre, rol: c.rol, bloqueado: c.bloqueado });
  };

  $('bNuevo').onclick = async () => {
    const vis = $('picker').classList.toggle('hidden');
    $('convs').classList.toggle('hidden', !vis);
    if (vis) return;
    try {
      const cs = await Cuenta.rpc('my_contacts');
      $('contactos').innerHTML = cs.length ? cs.map((c) =>
        '<li data-id="' + c.id + '" data-n="' + Core.esc(c.nombre) + '" data-r="' + c.rol + '"><div class="av">' + Core.esc(c.nombre.charAt(0).toUpperCase()) +
        '</div><div class="grow"><b>' + Core.esc(c.nombre) + '</b><div class="muted">' + Core.esc(ROL[c.rol] || '') +
        (c.detalle ? ' · ' + Core.esc(c.detalle) : '') + '</div></div></li>').join('')
        : '<li class="empty">' + (yo.role === 'user' ? 'Aún no tienes clientes. Invítalos desde el inicio.' : 'Sin contactos disponibles') + '</li>';
    } catch (e) { Core.toast(e.message); }
  };
  $('contactos').onclick = (e) => {
    const li = e.target.closest('li[data-id]');
    if (!li) return;
    $('picker').classList.add('hidden'); $('convs').classList.remove('hidden');
    abrir({ id: li.dataset.id, nombre: li.dataset.n, rol: li.dataset.r, bloqueado: false });
  };

  async function abrir(c) {
    actual = c;
    bloqueado = !!c.bloqueado;
    $('wrap').classList.add('abierto');
    $('cab').classList.remove('hidden');
    $('comp').classList.remove('hidden');
    $('cabNombre').textContent = c.nombre;
    $('cabAv').textContent = (c.nombre || '?').charAt(0).toUpperCase();
    $('cabSub').textContent = ROL[c.rol] || '';
    $('bBloquear').classList.toggle('hidden', c.rol === 'admin');
    $('bBloquear').textContent = bloqueado ? 'Desbloquear' : 'Bloquear';
    history.replaceState(null, '', '?con=' + c.id);
    $('msgs').innerHTML = '<div class="vacio">Cargando…</div>';
    await cargarHilo(true);
    clearInterval(timer);
    timer = setInterval(() => { if (!document.hidden) cargarHilo(false); }, 8000);
    pintarLista();
  }

  let ultimoId = null;
  async function cargarHilo(forzar) {
    if (!actual) return;
    let ms;
    try { ms = await Cuenta.rpc('chat_messages', { p_other: actual.id }); } catch (e) { return; }
    const last = ms.length ? ms[ms.length - 1].id + (ms[ms.length - 1].read_at || '') : '';
    if (!forzar && last === ultimoId) return;
    ultimoId = last;
    let dia = '';
    $('msgs').innerHTML = ms.length ? ms.map((m) => {
      const d = diaTxt(m.created_at);
      const sep = d !== dia ? '<div class="dia">' + (dia = d) + '</div>' : '';
      return sep + '<div class="b' + (m.mio ? ' mio' : '') + '">' + Core.esc(m.body) + '<small>' + hora(m.created_at) +
        (m.mio ? (m.read_at ? ' · ✓✓ Visto' : ' · ✓ Enviado') : '<button class="rep" data-id="' + m.id + '" title="Reportar mensaje">🚩</button>') + '</small></div>';
    }).join('') : '<div class="vacio">Escribe el primer mensaje 👋</div>';
    $('msgs').scrollTop = $('msgs').scrollHeight;
    await pintarCupo();
    cargarLista();
  }

  async function pintarCupo() {
    if (admin) { $('tip').innerHTML = 'Como administrador puedes enviar mensajes sin límite.'; $('bEnviar').disabled = false; return; }
    if (bloqueado) { $('tip').innerHTML = 'Bloqueaste esta conversación. Desbloquéala para escribir.'; $('bEnviar').disabled = true; return; }
    let r = 3;
    try { r = await Cuenta.rpc('chat_remaining', { p_other: actual.id }); } catch (e) { /* sin red */ }
    $('bEnviar').disabled = r <= 0;
    $('texto').disabled = r <= 0;
    $('tip').innerHTML = r <= 0
      ? '⏳ Ya enviaste 3 mensajes seguidos. Podrás escribir de nuevo cuando te respondan.'
      : '💡 Envía tu consulta completa: tienes <b>' + r + ' de 3</b> mensajes antes de recibir respuesta.';
  }

  async function enviar() {
    const txt = $('texto').value.trim();
    if (!txt || !actual) return;
    $('bEnviar').disabled = true;
    try {
      const r = await Cuenta.rpc('send_message', { p_to: actual.id, p_body: txt });
      if (!r.ok) throw new Error(r.error);
      $('texto').value = '';
      Cuenta.sb.functions.invoke('enviar').catch(() => {}); // aviso push inmediato
      await cargarHilo(true);
    } catch (e) { Core.toast(e.message); await pintarCupo(); }
  }
  $('bEnviar').onclick = enviar;
  $('texto').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(min-width: 860px)').matches) { e.preventDefault(); enviar(); } });

  $('msgs').onclick = async (e) => {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id || !e.target.classList.contains('rep')) return;
    const motivo = prompt('¿Por qué reportas este mensaje? (spam, insultos, fraude…)');
    if (motivo === null) return;
    try {
      const r = await Cuenta.rpc('report_message', { p_message: id, p_reason: motivo });
      if (!r.ok) throw new Error(r.error);
      Core.toast('Gracias. El administrador revisará el reporte.');
    } catch (err) { Core.toast(err.message); }
  };

  $('bBloquear').onclick = async () => {
    if (!actual) return;
    if (!bloqueado && !confirm('¿Bloquear a ' + actual.nombre + '? Ninguno de los dos podrá escribir hasta que desbloquees.')) return;
    try {
      await Cuenta.rpc('block_contact', { p_other: actual.id, p_block: !bloqueado });
      bloqueado = !bloqueado;
      $('bBloquear').textContent = bloqueado ? 'Desbloquear' : 'Bloquear';
      Core.toast(bloqueado ? 'Contacto bloqueado' : 'Contacto desbloqueado');
      pintarCupo();
    } catch (err) { Core.toast(err.message); }
  };

  $('bVolverLista').onclick = () => {
    $('wrap').classList.remove('abierto');
    actual = null; clearInterval(timer);
    history.replaceState(null, '', location.pathname);
    cargarLista();
  };

  await cargarLista();
  const con = new URLSearchParams(location.search).get('con');
  const txt = (new URLSearchParams(location.search).get('txt') || '').slice(0, 300); // mensaje sugerido (desde una oferta o producto)
  if (/^[0-9a-f-]{36}$/i.test(con || '')) {
    const c = convs.find((x) => x.other === con);
    if (c) abrir({ id: c.other, nombre: c.nombre, rol: c.rol, bloqueado: c.bloqueado });
    else {
      try {
        const cs = await Cuenta.rpc('my_contacts');
        const k = cs.find((x) => x.id === con);
        if (k) abrir({ id: k.id, nombre: k.nombre, rol: k.rol, bloqueado: false });
      } catch (e) { /* sin red */ }
    }
    if (txt && actual && !$('texto').value) { $('texto').value = txt; $('texto').focus(); }
  }
  setInterval(() => { if (!document.hidden && !actual) cargarLista(); }, 20000);
})();
</script>
</body>
</html>
